# Render Blueprint for MergixLabs-be.
# Docs: https://render.com/docs/blueprint-spec
#
# NOTE: "plan: starter" is used because Persistent Disks (the web service below)
# and the paid Redis/Postgres tiers required by this app are not available on
# Render's free plan. Adjust plans/region to your account as needed.
#
# NOTE: for docker-runtime services, Render does not use buildCommand/startCommand
# (those apply only to native/non-Docker runtimes). The build step is the Dockerfile's
# build stages; the start step is the Dockerfile's CMD (.scripts/entrypoint.sh for the
# web service, overridden via dockerCommand for the Celery worker/beat services below).
#
# NOTE on repetition below: envVars is written out in full for each service rather than
# shared via a YAML anchor/alias. YAML's merge key (`<<`) is only defined for merging
# mappings, not for splicing one sequence into another with extra items -- there's no
# clean, portable way to anchor a *list* of env vars and then add one extra entry per
# service (SECRET_KEY differs: generated on web, referenced from worker/beat). Explicit
# repetition here is what's actually correct, not just simpler.

databases:
  - name: mergixlabs-db
    databaseName: mergixlabs
    user: mergixlabs
    plan: starter
    region: oregon

services:
  - type: redis
    name: mergixlabs-redis
    plan: starter
    region: oregon
    ipAllowList: [] # internal-only: reachable from other services in this account, not the public internet

  - type: web
    name: mergixlabs-be
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    autoDeploy: true
    healthCheckPath: /health/
    # Runs once before new instances receive traffic -- keeps migrations from racing
    # if this service is ever scaled to multiple instances. entrypoint.sh also runs
    # migrate on every boot (idempotent), which is what makes local docker-compose work.
    preDeployCommand: python manage.py migrate --noinput
    disk:
      name: media
      mountPath: /app/media
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false # e.g. mergixlabs-be.onrender.com,yourdomain.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://app.yourdomain.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false # e.g. https://app.yourdomain.com,https://mergixlabs-be.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: mergixlabs-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /app/media
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: mergixlabs-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: mergixlabs-redis
          property: connectionString
      - key: ACCESS_TOKEN_LIFETIME
        value: "15"
      - key: REFRESH_TOKEN_LIFETIME
        value: "10080"
      - key: AUTH_COOKIE_SECURE
        value: "True"
      - key: AUTH_COOKIE_HTTP_ONLY
        value: "True"
      - key: AUTH_COOKIE_SAMESITE
        value: "Lax" # use "None" if the frontend is on a different site (requires Secure cookies, already on)
      - key: AUTH_COOKIE_DOMAIN
        value: "None"
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CALENDAR_ID
        value: primary
      - key: GOOGLE_ADMIN_EMAIL
        sync: false
      - key: MEETING_TIMEZONE
        value: Asia/Kolkata
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SENTRY_DSN
        sync: false

  # Celery worker: reuses the exact same image, only the container command differs.
  # KNOWN LIMITATION: this service does NOT have access to the web service's Persistent
  # Disk (Render disks attach to one service only). apps.fintech_ai's
  # ingest_document_task reads an uploaded KnowledgeDocument.file from MEDIA_ROOT on the
  # worker -- since that file was written to the *web* service's disk, this read will
  # fail here. See readme.md for the accepted tradeoff and future fix (move media to S3).
  - type: worker
    name: mergixlabs-celery-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A core worker --loglevel=info -P eventlet
    plan: starter
    region: oregon
    autoDeploy: true
    envVars:
      # Pulled from the web service so all three services sign/verify with the same
      # Django SECRET_KEY, instead of each generating its own independent value.
      - key: SECRET_KEY
        fromService:
          type: web
          name: mergixlabs-be
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mergixlabs-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /app/media
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: mergixlabs-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: mergixlabs-redis
          property: connectionString
      - key: ACCESS_TOKEN_LIFETIME
        value: "15"
      - key: REFRESH_TOKEN_LIFETIME
        value: "10080"
      - key: AUTH_COOKIE_SECURE
        value: "True"
      - key: AUTH_COOKIE_HTTP_ONLY
        value: "True"
      - key: AUTH_COOKIE_SAMESITE
        value: "Lax"
      - key: AUTH_COOKIE_DOMAIN
        value: "None"
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CALENDAR_ID
        value: primary
      - key: GOOGLE_ADMIN_EMAIL
        sync: false
      - key: MEETING_TIMEZONE
        value: Asia/Kolkata
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: worker
    name: mergixlabs-celery-beat
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A core beat --loglevel=info
    plan: starter
    region: oregon
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        fromService:
          type: web
          name: mergixlabs-be
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mergixlabs-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /app/media
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: mergixlabs-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: mergixlabs-redis
          property: connectionString
      - key: ACCESS_TOKEN_LIFETIME
        value: "15"
      - key: REFRESH_TOKEN_LIFETIME
        value: "10080"
      - key: AUTH_COOKIE_SECURE
        value: "True"
      - key: AUTH_COOKIE_HTTP_ONLY
        value: "True"
      - key: AUTH_COOKIE_SAMESITE
        value: "Lax"
      - key: AUTH_COOKIE_DOMAIN
        value: "None"
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CALENDAR_ID
        value: primary
      - key: GOOGLE_ADMIN_EMAIL
        sync: false
      - key: MEETING_TIMEZONE
        value: Asia/Kolkata
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
