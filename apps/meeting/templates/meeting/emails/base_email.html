<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Mergix Labs{% endblock %}</title>
<style>
  body { margin:0; padding:0; background-color:#f4f4f7; font-family:'Segoe UI', Arial, sans-serif; color:#1f2937; }
  .wrapper { width:100%; padding:24px 0; background-color:#f4f4f7; }
  .container { max-width:560px; margin:0 auto; background-color:#ffffff; border-radius:10px; overflow:hidden; border:1px solid #e5e7eb; }
  .header { background-color:#111827; padding:24px 32px; }
  .header .logo { color:#ffffff; font-size:20px; font-weight:700; letter-spacing:0.5px; margin:0; }
  .header .tagline { color:#9ca3af; font-size:12px; margin:4px 0 0; }
  .body { padding:32px; }
  .heading { font-size:20px; font-weight:600; margin:0 0 16px; color:#111827; }
  .card { background-color:#f9fafb; border:1px solid #e5e7eb; border-radius:8px; padding:16px 20px; margin:20px 0; }
  .info-table { width:100%; border-collapse:collapse; }
  .info-table td { padding:6px 0; font-size:14px; vertical-align:top; }
  .info-table td.label { color:#6b7280; width:150px; }
  .info-table td.value { color:#111827; font-weight:500; }
  .agenda { background-color:#f9fafb; border-left:3px solid #7c3aed; padding:12px 16px; margin:16px 0; font-size:14px; color:#374151; }
  .button-row { margin:24px 0; }
  .button { display:inline-block; padding:12px 22px; border-radius:6px; text-decoration:none; font-size:14px; font-weight:600; margin:0 12px 12px 0; }
  .btn-meet { background-color:#7c3aed; color:#ffffff !important; }
  .btn-calendar { background-color:#ffffff; color:#7c3aed !important; border:1px solid #7c3aed; }
  .footer { padding:20px 32px; font-size:12px; color:#9ca3af; border-top:1px solid #e5e7eb; }
  .meta-note { font-size:12px; color:#9ca3af; margin-top:24px; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="container">
    <div class="header">
      <p class="logo">Mergix Labs</p>
      <p class="tagline">Meeting Scheduler</p>
    </div>
    <div class="body">
      <h1 class="heading">{% block heading %}{% endblock %}</h1>
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      This is an automated message from Mergix Labs Meeting Scheduler. Please do not reply to this email.
    </div>
  </div>
</div>
</body>
</html>
